<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="appTitle"></title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-2.2a13 13 0 0 0-1.2-3.1A8 8 0 0 1 18.9 8ZM12 4c.7.9 1.3 2.2 1.7 4h-3.4C10.7 6.2 11.3 4.9 12 4ZM4.3 14a8 8 0 0 1 0-4h2.5a19 19 0 0 0 0 4H4.3Zm.9 2h2.1c.3 1.1.7 2.2 1.2 3.1A8 8 0 0 1 5.2 16Zm2.1-8H5.2a8 8 0 0 1 3.3-3.1C8 5.8 7.6 6.9 7.3 8ZM12 20c-.7-.9-1.3-2.2-1.7-4h3.4c-.4 1.8-1 3.1-1.7 4Zm2-6H10a17 17 0 0 1 0-4h4a17 17 0 0 1 0 4Zm.7 5.1c.5-.9.9-2 1.2-3.1h2.1a8 8 0 0 1-3.3 3.1Zm1.5-5.1a19 19 0 0 0 0-4h2.5a8 8 0 0 1 0 4h-2.5Z"
          />
        </svg>
        <span data-i18n="appTitle"></span>
      </div>
      <span class="pill" id="engine-pill" data-i18n="statusDetecting"></span>
    </header>

    <nav class="tabs">
      <button type="button" class="tab-btn active" data-tab="text" data-i18n="tabText"></button>
      <button type="button" class="tab-btn" data-tab="page" data-i18n="tabPage"></button>
      <button type="button" class="tab-btn" data-tab="history" data-i18n="tabHistory"></button>
      <button type="button" class="tab-btn" data-tab="settings" data-i18n="tabSettings"></button>
    </nav>

    <main>
      <!-- ============================ 文本 ============================ -->
      <section class="tab-panel active" id="tab-text">
        <div class="row">
          <select id="src-lang" class="grow" data-i18n-title="sourceLangTitle" title=""></select>
          <button type="button" class="icon" id="swap" data-i18n-title="swapLangs" title="">⇄</button>
          <select id="tgt-lang" class="grow" data-i18n-title="targetLangTitle" title=""></select>
        </div>

        <textarea id="input" rows="5" data-i18n-placeholder="inputPlaceholder" placeholder=""></textarea>
        <div class="row between">
          <label class="chk"><input type="checkbox" id="auto-input" /> <span data-i18n="inputAutoTranslate"></span></label>
          <span class="muted small" id="count">0</span>
        </div>
        <div class="row">
          <button type="button" class="primary grow" id="do-translate" data-i18n="translate"></button>
          <button type="button" id="do-explain" data-i18n="explain"></button>
          <button type="button" class="icon" id="do-paste" data-i18n="paste" data-i18n-title="paste" title=""></button>
          <button type="button" class="icon" id="do-clear" data-i18n="clear" data-i18n-title="clear" title=""></button>
        </div>

        <div class="out-wrap">
          <div class="out-head">
            <span class="muted small" id="out-meta" data-i18n="translationOutput"></span>
            <span class="grow"></span>
            <button type="button" class="mini" id="out-copy" data-i18n="copy"></button>
            <button type="button" class="mini" id="out-speak" data-i18n="speak"></button>
            <button type="button" class="mini" id="out-back" data-i18n="backTranslate" data-i18n-title="backTranslate" title=""></button>
          </div>
          <div id="output" class="output" dir="auto"><span class="placeholder" data-i18n="outputPlaceholder"></span></div>
        </div>
        <div id="text-error" class="error" hidden></div>
        <p class="hint" data-i18n="textPrivacyHint"></p>
      </section>

      <!-- ============================ 页面 ============================ -->
      <section class="tab-panel" id="tab-page">
        <div class="card">
          <div class="page-title" id="page-title">—</div>
          <div class="muted small ellipsis" id="page-url"></div>
          <div class="row">
            <button type="button" class="primary grow" id="page-translate" data-i18n="pageTranslate"></button>
            <button type="button" id="page-dual" data-i18n="pageDual"></button>
            <button type="button" id="page-hover" data-i18n="pageHover"></button>
          </div>
          <div class="row">
            <button type="button" class="grow" id="page-restore" data-i18n="pageRestore"></button>
            <button type="button" id="page-refresh" data-i18n="pageRefresh"></button>
          </div>
          <div class="progress"><i id="page-bar"></i></div>
          <div class="muted small" id="page-status" data-i18n="pageStatusIdle"></div>
          <div class="muted small" id="page-guide" hidden></div>
        </div>

        <div class="card">
          <div class="label"><span data-i18n="sitePrefsTitle"></span> <span class="muted small" id="site-host">—</span></div>
          <div class="muted small" id="site-pref-summary" data-i18n="sitePrefsNone"></div>
          <div class="muted small" id="site-global-hint"></div>
          <div class="row">
            <button type="button" class="grow" id="site-save-pref" data-i18n="siteSavePref"></button>
            <button type="button" id="site-clear-pref" data-i18n="siteClearPref"></button>
          </div>
          <div class="row">
            <button type="button" class="grow" id="site-toggle-auto" data-i18n="siteAutoOff"></button>
            <button type="button" id="site-toggle-never" data-i18n="siteNeverAdd"></button>
          </div>
          <p class="hint compact" data-i18n="sitePrefsHint"></p>
        </div>

        <div class="card">
          <div class="label" data-i18n="selectionTitle"></div>
          <div class="row">
            <button type="button" class="grow" id="sel-translate" data-i18n="selTranslate"></button>
            <button type="button" id="sel-explain" data-i18n="selExplain" data-i18n-title="pageSelectionHint" title=""></button>
          </div>
          <div id="sel-result" class="output small" hidden></div>
        </div>

        <div class="card">
          <div class="label" data-i18n="modelsTitle"></div>
          <div id="model-list" class="model-list"></div>
          <div class="row">
            <button type="button" class="grow" id="download-models" data-i18n="downloadPair"></button>
          </div>
          <div class="progress"><i id="dl-bar"></i></div>
          <div class="muted small" id="dl-status" data-i18n="dlStatusDefault"></div>
          <div id="hw-check" class="muted small" hidden></div>
          <div id="dl-hint" class="hint-box" hidden>
            <div class="small" id="dl-hint-text"></div>
            <div class="row">
              <button type="button" class="grow" id="use-nano" data-i18n="useNanoEngine"></button>
            </div>
          </div>
          <details class="disclosure">
            <summary data-i18n="advancedTroubleshoot"></summary>
            <div class="disclosure-body">
              <div class="row">
                <button type="button" class="grow" id="nano-download" data-i18n="downloadNano"></button>
                <button type="button" id="selftest" data-i18n="selftest"></button>
              </div>
              <div class="row">
                <button type="button" class="grow" id="open-components" data-i18n="openComponents"></button>
                <button type="button" class="grow" id="open-on-device" data-i18n="openOnDevice"></button>
              </div>
              <p class="hint compact" data-i18n="modelsTroubleshootHint"></p>
            </div>
          </details>
        </div>
      </section>

      <!-- ============================ 历史 ============================ -->
      <section class="tab-panel" id="tab-history">
        <div class="card">
          <div class="label"><span data-i18n="historyTitle"></span> <span class="muted small" data-i18n="historyLocalOnly"></span></div>
          <label class="chk"><input type="checkbox" id="history-enabled" /> <span data-i18n="historyEnabled"></span></label>
          <div class="row">
            <button type="button" class="grow" id="history-refresh" data-i18n="historyRefresh"></button>
            <button type="button" id="history-clear" data-i18n="historyClear"></button>
          </div>
          <p class="hint" data-i18n="historyHint"></p>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>

      <!-- ============================ 设置 ============================ -->
      <section class="tab-panel" id="tab-settings">
        <div class="muted small" id="save-status" data-i18n="settingsAutoSave"></div>
        <div class="card">
          <div class="label" data-i18n="engineLabel"></div>
          <select id="engine" data-i18n-title="engineSelectTitle" title="">
            <option value="auto" data-i18n="engineAuto"></option>
            <option value="translator" data-i18n="engineTranslator"></option>
            <option value="nano" data-i18n="engineNano"></option>
          </select>
          <div class="label"><span data-i18n="toneLabel"></span> <span class="muted small" data-i18n="toneNanoHint"></span></div>
          <select id="tone"></select>
          <details class="disclosure">
            <summary data-i18n="advancedNanoSummary"></summary>
            <div class="disclosure-body">
              <div class="label"><span data-i18n="glossaryLabel"></span> <span class="muted small" data-i18n="glossaryHint"></span></div>
              <textarea id="glossary" rows="3" data-i18n-placeholder="glossaryPlaceholder" placeholder=""></textarea>
              <div class="label"><span data-i18n="contextLabel"></span> <span class="muted small" data-i18n="contextHint"></span></div>
              <textarea id="context" rows="2" data-i18n-placeholder="contextPlaceholder" placeholder=""></textarea>
            </div>
          </details>
        </div>

        <div class="card">
          <div class="label" data-i18n="selectionTranslationLabel"></div>
          <label class="chk"><input type="checkbox" id="show-bubble" /> <span data-i18n="showBubble"></span></label>
          <label class="chk"><input type="checkbox" id="dblclick" /> <span data-i18n="dblclickTranslate"></span></label>
        </div>

        <div class="card">
          <div class="label" data-i18n="inlineRewriteTitle"></div>
          <p class="hint compact" data-i18n="inlineRewriteHint"></p>
          <label class="chk"><input type="checkbox" id="inline-enabled" /> <span data-i18n="inlineEnabled"></span></label>
          <select id="inline-mode">
            <option value="button" data-i18n="inlineModeButton"></option>
            <option value="auto" data-i18n="inlineModeAuto"></option>
            <option value="off" data-i18n="inlineModeOff"></option>
          </select>
          <label class="grow small"><span data-i18n="inlineTargetLanguage"></span>
            <select id="inline-target"></select>
          </label>
          <details class="disclosure">
            <summary><span data-i18n="inlineAdvanced"></span> <span class="muted small" id="inline-rules-count"></span></summary>
            <div class="disclosure-body">
              <select id="inline-insert">
                <option value="replace" data-i18n="inlineInsertReplace"></option>
                <option value="append" data-i18n="inlineInsertAppend"></option>
                <option value="copy" data-i18n="inlineInsertCopy"></option>
              </select>
              <label class="chk"><input type="checkbox" id="inline-live" /> <span data-i18n="inlineLive"></span></label>
              <label class="grow small"><span data-i18n="inlineMinChars"></span> <input type="number" id="inline-min" min="1" step="1" /></label>
              <div class="row between">
                <div class="label"><span data-i18n="inlineNeverSitesLabel"></span> <span class="muted small" data-i18n="inlineNeverSitesHint"></span></div>
                <button type="button" class="mini" id="inline-never-clear" data-i18n="clear"></button>
              </div>
              <textarea id="inline-never" rows="2" data-i18n-placeholder="inlineNeverPlaceholder" placeholder="mail.google.com"></textarea>
              <p class="hint compact" data-i18n="inlineShortcutHint"></p>
              <div class="row">
                <button type="button" class="grow" id="inline-probe" data-i18n="inlineProbeBtn"></button>
              </div>
              <div id="inline-hint" class="hint" hidden></div>
              <div id="inline-probe-out" class="diag" hidden></div>
              <p class="hint compact" data-i18n="inlineProbeDesc"></p>
            </div>
          </details>
        </div>

        <div class="card">
          <div class="label" data-i18n="pageTranslationTitle"></div>
          <select id="display-mode">
            <option value="replace" data-i18n="displayReplace"></option>
            <option value="dual" data-i18n="displayDual"></option>
            <option value="hover" data-i18n="displayHover"></option>
          </select>
          <label class="chk"><input type="checkbox" id="auto-translate" /> <span data-i18n="pageAutoTranslate"></span></label>
          <p class="hint compact" data-i18n="siteRulesPriorityHint"></p>
          <details class="disclosure" id="site-rules-disclosure">
            <summary><span data-i18n="globalSiteRulesAdvanced"></span> <span class="muted small" id="page-rules-count"></span></summary>
            <div class="disclosure-body">
              <div class="site-rules-manager" id="site-rules-manager">
                <div class="row">
                  <input id="site-rule-input" class="grow" type="text" data-i18n-placeholder="addHostPlaceholder" placeholder="" />
                  <button type="button" id="site-rule-add" class="primary" data-i18n="add"></button>
                </div>
                <div class="row site-rule-flags">
                  <label class="chk small"><input type="checkbox" id="site-rule-flag-auto" /> <span data-i18n="siteRuleFlagAuto"></span></label>
                  <label class="chk small"><input type="checkbox" id="site-rule-flag-never" /> <span data-i18n="siteRuleFlagNever"></span></label>
                  <label class="chk small"><input type="checkbox" id="site-rule-flag-inline" /> <span data-i18n="siteRuleFlagInline"></span></label>
                </div>
                <div class="row">
                  <input id="site-rule-search" class="grow" type="text" data-i18n-placeholder="searchHostPlaceholder" placeholder="" />
                </div>
                <div id="site-rule-list" class="site-rule-list"></div>
                <div class="row">
                  <button type="button" class="mini" id="site-rules-export" data-i18n="exportJson"></button>
                  <button type="button" class="mini" id="site-rules-import" data-i18n="importJson"></button>
                  <button type="button" class="mini" id="site-rules-clear-all" data-i18n="clearAllRules"></button>
                </div>
                <input id="site-rules-import-file" type="file" accept="application/json,.json" hidden />
              </div>
              <details class="disclosure inner">
                <summary data-i18n="bulkTextEdit"></summary>
                <div class="disclosure-body">
                  <div class="row between">
                    <div class="label"><span data-i18n="autoSitesLabel"></span> <span class="muted small" data-i18n="autoSitesHint"></span></div>
                    <button type="button" class="mini" id="auto-sites-clear" data-i18n="clear"></button>
                  </div>
                  <textarea id="auto-sites" rows="2" data-i18n-placeholder="autoSitesPlaceholder" placeholder="news.ycombinator.com"></textarea>
                  <div class="row between">
                    <div class="label"><span data-i18n="neverSitesLabel"></span> <span class="muted small" data-i18n="neverSitesHint"></span></div>
                    <button type="button" class="mini" id="never-sites-clear" data-i18n="clear"></button>
                  </div>
                  <textarea id="never-sites" rows="2" data-i18n-placeholder="neverSitesPlaceholder" placeholder="mail.google.com"></textarea>
                  <div class="row between">
                    <div class="label"><span data-i18n="inlineNeverMirrorLabel"></span> <span class="muted small" data-i18n="inlineNeverMirrorHint"></span></div>
                    <button type="button" class="mini" id="inline-never-clear-inline" data-i18n="clear"></button>
                  </div>
                  <textarea id="inline-never-mirror" rows="2" data-i18n-placeholder="inlineNeverMirrorPlaceholder" placeholder="mail.google.com"></textarea>
                </div>
              </details>
              <label class="grow small"><span data-i18n="minAutoCharsLabel"></span> <input type="number" id="min-chars" min="0" step="50" /></label>
              <label class="grow small"><span data-i18n="maxNodesLabel"></span> <input type="number" id="max-nodes" min="50" step="100" /></label>
              <label class="chk"><input type="checkbox" id="skip-same-lang" /> <span data-i18n="skipSameLang"></span></label>
            </div>
          </details>
        </div>

        <div class="card">
          <div class="label" data-i18n="performanceDisplayLabel"></div>
          <label class="chk"><input type="checkbox" id="cache-enabled" /> <span data-i18n="cacheLabel"></span></label>
          <div class="row">
            <button type="button" id="cache-clear" data-i18n="cacheClearBtn"></button>
            <span class="muted small" id="cache-size">—</span>
          </div>
          <label class="grow small"><span data-i18n="theme"></span>
            <select id="theme">
              <option value="auto" data-i18n="themeAuto"></option>
              <option value="light" data-i18n="themeLight"></option>
              <option value="dark" data-i18n="themeDark"></option>
            </select>
          </label>
          <details class="disclosure">
            <summary data-i18n="advancedLabel"></summary>
            <div class="disclosure-body">
              <label class="grow small"><span data-i18n="concurrency"></span>
                <select id="concurrency">
                  <option value="1" data-i18n="concurrency1"></option>
                  <option value="2" data-i18n="concurrency2"></option>
                  <option value="3" data-i18n="concurrency3">3</option>
                  <option value="4" data-i18n="concurrency4"></option>
                </select>
              </label>
              <div class="row">
                <button type="button" class="grow" id="engine-reset" data-label="" data-i18n="resetLocalSession"></button>
              </div>
            </div>
          </details>
        </div>

        <div class="card">
          <div class="label" data-i18n="statusDiagnostics"></div>
          <div id="diag" class="diag"></div>
          <div class="row">
            <button type="button" class="grow" id="diag-refresh" data-i18n="recheckBtn"></button>
            <button type="button" id="diag-copy" data-i18n="copyDiagBtn"></button>
          </div>
          <details class="disclosure">
            <summary data-i18n="troubleshootLabel"></summary>
            <div class="disclosure-body">
              <p class="hint compact" data-i18n="troubleshootDesc"></p>
              <div class="row">
                <button type="button" class="grow" id="diag-selftest" data-i18n="selftest"></button>
              </div>
            </div>
          </details>
        </div>

        <p class="hint compact" data-i18n="shortcutsLabel"></p>
      </section>
    </main>

    <!-- 页脚：纯静态，不加载任何第三方脚本、不发网络请求 -->
    <footer class="footer">
      <span id="footer-tagline" data-i18n="footerTagline"></span>
      <span class="footer-links">
        <span id="footer-sponsors"></span>
        <a id="footer-project" class="footer-link" href="https://github.com/wstszx/chrome-local-translate" target="_blank" rel="noopener noreferrer" data-i18n="projectHome"></a>
      </span>
    </footer>

    <script type="module" src="panel.js"></script>
  </body>
</html>
