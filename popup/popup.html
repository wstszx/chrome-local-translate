<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="appTitle"></title>
    <link rel="stylesheet" href="../sidepanel/panel.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <header class="bar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2c.7.9 1.3 2.2 1.7 4h-3.4C10.7 6.2 11.3 4.9 12 4ZM4.3 14a8 8 0 0 1 0-4h2.5a19 19 0 0 0 0 4H4.3Zm.9 2h2.1c.3 1.1.7 2.2 1.2 3.1A8 8 0 0 1 5.2 16Zm7.9 4c-.7-.9-1.3-2.2-1.7-4h3.4c-.4 1.8-1 3.1-1.7 4Zm2-6h-4a17 17 0 0 1 0-4h4a17 17 0 0 1 0 4Zm.8 5.1c.5-.9.9-2 1.2-3.1h2.1a8 8 0 0 1-3.3 3.1Zm1.4-5.1a19 19 0 0 0 0-4h2.5a8 8 0 0 1 0 4h-2.5ZM4.3 10a8 8 0 0 1 3.3-3.1c-.5.9-.9 2-1.2 3.1H4.3Z"
          />
        </svg>
        <span data-i18n="appTitle"></span>
      </div>
      <span class="pill" id="engine-pill">…</span>
    </header>

    <div class="body">
      <div class="row">
        <select id="src-lang" class="grow" data-i18n-title="sourceLangTitle" title=""></select>
        <button type="button" class="icon" id="swap" data-i18n-title="swapLangs" title="">⇄</button>
        <select id="tgt-lang" class="grow" data-i18n-title="targetLangTitle" title=""></select>
      </div>

      <textarea id="input" rows="4" data-i18n-placeholder="popupInputPlaceholder" placeholder=""></textarea>
      <div class="row">
        <button type="button" class="primary grow" id="do-translate" data-i18n="translate"></button>
        <button type="button" id="do-explain" data-i18n="explain" data-i18n-title="explain" title=""></button>
        <button type="button" class="icon" id="do-clear" data-i18n="clear" data-i18n-title="clear" title=""></button>
      </div>

      <div class="out-wrap">
        <div class="out-head">
          <span class="muted small" id="out-meta" data-i18n="translationOutput"></span>
          <span class="grow"></span>
          <button type="button" class="mini" id="out-copy" data-i18n="copy"></button>
          <button type="button" class="mini" id="out-speak" data-i18n="speak"></button>
        </div>
        <div id="output" class="output small" dir="auto"><span class="placeholder" data-i18n="popupOutputPlaceholder"></span></div>
      </div>
      <div id="error" class="error" hidden></div>

      <div class="row">
        <button type="button" class="grow" id="open-panel" data-i18n="openSidePanel"></button>
        <button type="button" class="grow" id="translate-page" data-i18n="translatePage"></button>
        <button type="button" class="grow" id="translate-dual" data-i18n="bilingualView"></button>
      </div>
      <p class="hint" data-i18n="popupHint"></p>
      <p class="hint popup-links" id="popup-sponsors"></p>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
